name: janrakshak_user
description: "JanRakshak AI - citizen disaster reporting, map, trip planner, alerts and emergency contacts (Android)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  connectivity_plus: 7.3.1
  fl_chart: 1.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.1
  flutter_map: 8.3.2
  flutter_riverpod: 3.4.3
  geocoding: 5.0.0
  geolocator: 14.0.3
  go_router: 18.0.1
  google_fonts: 8.2.1
  hive: 2.2.3
  hive_flutter: 1.1.0
  http: 1.6.0
  image_picker: 1.2.3
  latlong2: 0.10.1
  path: 1.9.1
  path_provider: 2.1.6
  supabase_flutter: 2.17.2
  url_launcher: 6.3.2
  uuid: 4.6.0
  vector_map_tiles: 9.0.0-beta.13
  vector_tile_renderer: 6.1.0
  workmanager: 0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  crypto: 3.0.7

flutter:
  uses-material-design: true
  assets:
    - assets/region_data.json
    - assets/basemap/style.json
    - assets/google_fonts/
