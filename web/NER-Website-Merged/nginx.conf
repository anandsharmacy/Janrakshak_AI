server {
  listen 80;
  root /usr/share/nginx/html;

  # Hashed assets never change; the HTML shell always revalidates.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Client-side routes (/login, /dashboard/control, …) fall back to the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
