# PostGIS + GeoServer for NER Logistics spatial analytics.
#   docker compose up -d && ./publish.sh
# GeoServer UI: http://localhost:8080/geoserver  (admin / geoserver)
services:
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ner
      POSTGRES_USER: ner
      POSTGRES_PASSWORD: ner
    volumes:
      # 01_schema → 02_seed → 03_analytics_views, run once on first start.
      - ./sql:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ner -d ner"]
      interval: 5s
      retries: 20

  geoserver:
    image: docker.osgeo.org/geoserver:2.28.5
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      SKIP_DEMO_DATA: "true"
      # WPS is needed for the vec:Heatmap rendering transformation.
      INSTALL_EXTENSIONS: "true"
      STABLE_EXTENSIONS: "wps"
      # Lets Flutter web builds call WMS/WFS directly.
      CORS_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    volumes:
      - gsdata:/opt/geoserver_data

volumes:
  pgdata:
  gsdata:
